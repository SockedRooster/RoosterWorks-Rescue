name: Validate RoosterWorks Rescue GameData

on:
  push:
    branches: [main]
    paths:
      - 'GameData/**'
      - 'Tools/validate.py'
      - 'CHECKSUMS-SHA256.txt'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check package availability and validate campaigns
        run: |
          if [ ! -d GameData/AgencyStationRescue ] || [ ! -d GameData/InterstellarExpansionCampaign ]; then
            echo 'GameData has not been uploaded to the GitHub repository yet.'
            echo 'Upload the GameData folder from RoosterWorks-Rescue-GitHub-Upload.zip.'
            exit 0
          fi
          python Tools/validate.py
