name: Validate RoosterWorks Rescue GameData

on:
  push:
    branches: [main]
    paths:
      - 'GameData/**'
      - 'Tools/validate.py'
      - 'CHECKSUMS-SHA256.txt'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate campaign source and referenced craft
        run: python Tools/validate.py
