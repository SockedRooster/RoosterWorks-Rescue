        vessel = Plock Echo Probe
        distance = 500
        title = Approach within 500 m of the Plock Echo Probe
    }

    PARAMETER
    {
        name = PreserveProbe
        type = VesselNotDestroyed
        vessel = Plock Echo Probe
        title = Preserve the Plock Echo Probe
    }

    BEHAVIOUR
    {
