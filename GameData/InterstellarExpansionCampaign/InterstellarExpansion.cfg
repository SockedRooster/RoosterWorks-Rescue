// ============================================================================
// Interstellar Expansion Campaign
// Contract Configurator campaign for KSP 1.12.5 + Kerbalism + Promised Worlds
//
// Progression:
//   01 Puf Forward Operations Station (Tuun)
//   02 Debdeb orbital salvage - Gurdamma
//   03 Debdeb surface salvage - Donk
//   04 Gurdamma orbital station
//   05 Gurdamma surface base
//   06 Lapat orbital station
//   07 Lapat surface base
//   08 Umod orbital station
//   09 Umod surface base
//
// Debdeb salvage craft are now integrated. Mystery assets are also live.
// ============================================================================

CONTRACT_GROUP:NEEDS[ContractConfigurator,Kerbalism,PromisedWorlds]
{
    name = InterstellarExpansionCampaign
    displayName = Interstellar Expansion
    minVersion = 1.30.5
    maxSimultaneous = 2
}

AGENT:NEEDS[ContractConfigurator,PromisedWorlds]
{
    name = Interstellar Exploration Directorate
    title = Interstellar Exploration Directorate
    description = A joint program tasked with establishing permanent Kerbal infrastructure beyond the Kerbol system.
    logoURL = ContractConfigurator/Agencies/Stations
    logoScaledURL = ContractConfigurator/Agencies/Stations_scaled
    mentality = NoRandomContractMentality
}


// ============================================================================
// 01 - TUUN / PUF - COMPACT FORWARD OPERATIONS STATION
// ============================================================================
CONTRACT_TYPE:NEEDS[ContractConfigurator,Kerbalism,PromisedWorlds]
{
    name = IEX_PufForwardStation
    group = InterstellarExpansionCampaign
    sortKey = IEX-01

    agent = Interstellar Exploration Directorate
    title = Establish a compact forward station at Puf
    genericTitle = Tuun Expedition: Puf Forward Station
    description = Establish KSP's first permanent foothold in the Tuun system. Because every tonne must cross interstellar distance, this is not a request for a sprawling orbital complex. Build a compact, durable station in Puf orbit with crew accommodations, a laboratory, docking capability, long-range communications, Kerbalism life-support capacity, passive shielding, and an active radiation shield.
    synopsis = Place a compact, crewed, Kerbalism-capable forward operations station in stable Puf orbit.
    notes = Small-footprint requirement: no more than 80 tonnes and no more than six seats. At least one Kerbalism Active Shield is required. Puf's atmosphere extends to approximately 53 km; the contract requires periapsis above 100 km.
    completedMessage = Puf Forward Station is operational. KSP now has a permanent logistics and research foothold in the Tuun system.

    targetBody = Puf
    prestige = Exceptional
    maxCompletions = 1
    maxSimultaneous = 1
    minExpiry = 30
    maxExpiry = 120

    advanceFunds = 2000000
    rewardFunds = 4000000
    rewardScience = 40
    rewardReputation = 35
    failureFunds = 500000
    failureReputation = 20

    REQUIREMENT
    {
        name = TuunDiscovered
        type = FlyBy
        targetBody = Tuun
        title = Discover the Tuun system
    }

    PARAMETER
    {
        name = BuildPufForwardStation
        type = VesselParameterGroup
        define = Puf Forward Station
        duration = 10m
        title = Commission Puf Forward Station

        PARAMETER
        {
            name = PufOrbit
            type = Orbit
            targetBody = Puf
            minPeA = 100000
            maxEccentricity = 0.20
            title = Establish a stable Puf orbit above 100 km
        }

        PARAMETER
        {
            name = StationType
            type = VesselIsType
            vesselType = Station
            title = Vessel must be classified as a Station
        }

        PARAMETER
        {
            name = CompactMass
            type = VesselMass
            maxMass = 80
            title = Keep total station mass at or below 80 tonnes
        }

        PARAMETER
        {
            name = CrewCapacity
            type = HasCrewCapacity
            minCapacity = 4
            maxCapacity = 6
            title = Provide 4 to 6 crew seats
        }

        PARAMETER
        {
            name = InitialCrew
            type = HasCrew
            minCrew = 2
            title = Staff the station with at least two Kerbals
        }

        PARAMETER
        {
            name = Relay
            type = HasAntenna
            minAntennaPower = 1
            antennaType = RELAY
            title = Install a relay-capable communications system
        }

        PARAMETER
        {
            name = EssentialHardware
            type = PartValidation
            title = Install the required station hardware

            VALIDATE
            {
                partModule = ModuleDockingNode
                minCount = 1
            }

            VALIDATE
            {
                partModule = Laboratory
                minCount = 1
            }

            VALIDATE
            {
                part = kerbalism-activeshield
                minCount = 1
            }
        }

        PARAMETER
        {
            name = LifeSupportCapacity
            type = HasResourceCapacity
            title = Provide interstellar life-support and shielding capacity

            RESOURCE
            {
                resource = ElectricCharge
                minQuantity = 5000
            }
            RESOURCE
            {
                resource = Food
                minQuantity = 400
            }
            RESOURCE
            {
                resource = Water
                minQuantity = 200
            }
            RESOURCE
            {
                resource = Oxygen
                minQuantity = 50000
            }
            RESOURCE
            {
                resource = Nitrogen
                minQuantity = 1500
            }
            RESOURCE
            {
                resource = Shielding
                minQuantity = 40
            }
        }
    }
}


// ============================================================================
// 02 - DEBDEB / GURDAMMA - GURDAMMA SENTINEL STATION SALVAGE
// ============================================================================
CONTRACT_TYPE:NEEDS[ContractConfigurator,Kerbalism,PromisedWorlds]
{
    name = IEX_DebdebStationSalvage
    group = InterstellarExpansionCampaign
    sortKey = IEX-02

    agent = Interstellar Exploration Directorate
    title = Rescue the crew of Gurdamma Sentinel Station
    genericTitle = Debdeb Salvage: Gurdamma Sentinel Station
    description = A distressed expeditionary station has been detected in Gurdamma orbit. Gurdamma Sentinel Station has lost all four primary solar arrays and one long-range transmitter; batteries and emergency consumables are already heavily depleted. Rendezvous, dock, recover all four crew members, and preserve the station for salvage. The failed transmitter is an Engineer-repairable Kerbalism failure.
    synopsis = Dock with Gurdamma Sentinel Station, recover its four-person expedition crew, and preserve the derelict station.
    notes = This mission becomes available after the Debdeb system has been reached. The station carries an Active Shield plus 85% passive shielding at spawn.
    completedMessage = Sentinel's expedition crew is safe. Under the interstellar salvage charter, Gurdamma Sentinel Station has been transferred to KSP ownership.

    targetBody = Gurdamma
    prestige = Exceptional
    maxCompletions = 1
    maxSimultaneous = 1
    minExpiry = 30
    maxExpiry = 120

    advanceFunds = 2500000
    rewardFunds = 5000000
    rewardScience = 45
    rewardReputation = 40
    failureFunds = 600000
    failureReputation = 25

    REQUIREMENT
    {
        name = DebdebDiscovered
        type = FlyBy
        targetBody = Debdeb
        title = Discover the Debdeb system
    }

    DATA
    {
        type = List<Kerbal>
        hidden = true
        rescueCrew = [NewKerbalWithTrait("Pilot"), NewKerbalWithTrait("Engineer"), NewKerbalWithTrait("Scientist"), NewKerbalWithTrait("Scientist")]
    }

    PARAMETER
    {
        name = DockWithSentinel
        type = Docking
        vessel = Gurdamma Sentinel Station
        title = Dock with Gurdamma Sentinel Station
    }

    PARAMETER
    {
        name = PreserveSentinel
        type = VesselNotDestroyed
        vessel = Gurdamma Sentinel Station
        title = Preserve Gurdamma Sentinel Station
    }

    PARAMETER
    {
        name = RecoverCrew
        type = RecoverKerbal
        kerbal = @/rescueCrew
        title = Recover all four Sentinel crew members to Kerbin
    }

    BEHAVIOUR
    {
        name = SpawnSentinel
        type = SpawnVessel
        VESSEL
        {
            name = Gurdamma Sentinel Station
            craftURL = InterstellarExpansionCampaign/Craft/GurdammaSentinelStation.craft
            flagURL = Squad/Flags/satellite
            vesselType = Station
            owned = false
            targetBody = Gurdamma
            ORBIT
            {
                SMA = 830000
                ECC = 0.03
                INC = 22
                LPE = 80
                LAN = 125
                MNA = 1.4
                EPH = UniversalTime()
                REF = 1
            }
            CREW
            {
                name = @/rescueCrew.ElementAt(0)
                addToRoster = true
            }
            CREW
            {
                name = @/rescueCrew.ElementAt(1)
                addToRoster = true
            }
            CREW
            {
                name = @/rescueCrew.ElementAt(2)
                addToRoster = true
            }
            CREW
            {
                name = @/rescueCrew.ElementAt(3)
                addToRoster = true
            }
        }
    }

    BEHAVIOUR
    {
        name = TransferSentinel
        type = ChangeVesselOwnership
        onState = CONTRACT_SUCCESS
        vessel = Gurdamma Sentinel Station
        owned = true
    }
}


// ============================================================================
// 03 - DEBDEB / DONK - DONK FRONTIER BASE SALVAGE
// ============================================================================
CONTRACT_TYPE:NEEDS[ContractConfigurator,Kerbalism,PromisedWorlds]
{
    name = IEX_DebdebBaseSalvage
    group = InterstellarExpansionCampaign
    sortKey = IEX-03

    agent = Interstellar Exploration Directorate
    title = Rescue the crew of Donk Frontier Base
    genericTitle = Debdeb Salvage: Donk Frontier Base
    description = Donk Frontier Base has been evacuated after a cascading environmental and electrical failure. Three communications transmitters, two solar arrays, and a greenhouse process controller are inoperative. Power is low, water and oxygen are near emergency levels, and the crew is waiting outside the installation. Reach the site, recover all three personnel, and preserve the base for salvage.
    synopsis = Reach Donk Frontier Base, recover its stranded three-person crew, and preserve the installation.
    notes = This mission becomes available after the Debdeb system has been reached. The base spawns with 80% passive shielding and deliberately depleted Kerbalism consumables.
    completedMessage = The Donk crew has been recovered. The abandoned Frontier Base is now under KSP control and can support future Gurdamma-system operations.

    targetBody = Donk
    prestige = Exceptional
    maxCompletions = 1
    maxSimultaneous = 1
    minExpiry = 30
    maxExpiry = 120

    advanceFunds = 3000000
    rewardFunds = 6000000
    rewardScience = 50
    rewardReputation = 45
    failureFunds = 750000
    failureReputation = 25

    REQUIREMENT
    {
        name = DebdebDiscovered
        type = FlyBy
        targetBody = Debdeb
        title = Discover the Debdeb system
    }

    DATA
    {
        type = List<Kerbal>
        hidden = true
        rescueCrew = [NewKerbalWithTrait("Engineer"), NewKerbalWithTrait("Scientist"), NewKerbalWithTrait("Pilot")]
    }

    BEHAVIOUR
    {
        name = BaseWaypoint
        type = WaypointGenerator
        WAYPOINT
        {
            name = Donk Frontier Base
            targetBody = Donk
            icon = balloon
            altitude = 0
            latitude = -12.50
            longitude = 48.00
        }
    }

    PARAMETER
    {
        name = ReachBase
        type = VisitWaypoint
        index = 0
        distance = 500
        title = Reach Donk Frontier Base
    }

    PARAMETER
    {
        name = PreserveBase
        type = VesselNotDestroyed
        vessel = Donk Frontier Base
        title = Preserve Donk Frontier Base
    }

    PARAMETER
    {
        name = RecoverCrew
        type = RecoverKerbal
        kerbal = @/rescueCrew
        title = Recover all three Donk crew members to Kerbin
    }

    BEHAVIOUR
    {
        name = SpawnBase
        type = SpawnVessel
        VESSEL
        {
            name = Donk Frontier Base
            craftURL = InterstellarExpansionCampaign/Craft/DonkFrontierBase.craft
            flagURL = Squad/Flags/satellite
            vesselType = Base
            owned = false
            targetBody = Donk
            lat = -12.50
            lon = 48.00
            height = 1.00
            heading = 90
            pitch = 0
            roll = 0
        }
    }

    BEHAVIOUR
    {
        name = SpawnRescueCrew
        type = SpawnKerbal
        KERBAL
        {
            kerbal = @/rescueCrew.ElementAt(0)
            targetBody = Donk
            lat = -12.495
            lon = 48.003
            heading = 30
            owned = false
            addToRoster = true
            kerbalType = Unowned
        }
        KERBAL
        {
            kerbal = @/rescueCrew.ElementAt(1)
            targetBody = Donk
            lat = -12.505
            lon = 48.002
            heading = 180
            owned = false
            addToRoster = true
            kerbalType = Unowned
        }
        KERBAL
        {
            kerbal = @/rescueCrew.ElementAt(2)
            targetBody = Donk
            lat = -12.500
            lon = 47.994
            heading = 300
            owned = false
            addToRoster = true
            kerbalType = Unowned
        }
    }

    BEHAVIOUR
    {
        name = TransferBase
        type = ChangeVesselOwnership
        onState = CONTRACT_SUCCESS
        vessel = Donk Frontier Base
        owned = true
    }
}


