    description = A faint intermittent carrier has been isolated near Plock. The source is a small artificial spacecraft whose batteries are completely dead. Its attitude controller, primary relay, three auxiliary transmitters, and all three solar arrays have failed. Approach the object closely, preserve it, and claim it for detailed analysis.
    synopsis = Rendezvous with the silent Plock Echo Probe and preserve the artifact.
    notes = The probe is intentionally spawned completely without electrical power. No crew rescue is involved.
    completedMessage = The Plock Echo Probe has been secured for KSP. Whatever its original mission was, the silent spacecraft is now available for detailed engineering and scientific examination.

    targetBody = Plock
    prestige = Exceptional
    maxCompletions = 1
    maxSimultaneous = 1
    minExpiry = 20
    maxExpiry = 90

