// 07 - SELENE ARK / DRES
// ============================================================================
CONTRACT_TYPE:NEEDS[ContractConfigurator,Kerbalism,StationPartsExpansionRedux]
{
    name = ASR_SeleneArk
    group = AgencyStationRescue
    sortKey = ASR-07

    agent = Meridian Research Directorate
    title = Evacuate Selene Ark
