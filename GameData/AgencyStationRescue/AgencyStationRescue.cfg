        VESSEL
        {
            name = Selene Ark
            craftURL = AgencyStationRescue/Craft/SeleneArk.craft
            flagURL = Squad/Flags/satellite
            vesselType = Station
            owned = false
            targetBody = Dres

            ORBIT
            {
                SMA = 388000
                ECC = 0.04
                INC = 37
                LPE = 120
                LAN = 70
                MNA = 2.1
                EPH = UniversalTime()
