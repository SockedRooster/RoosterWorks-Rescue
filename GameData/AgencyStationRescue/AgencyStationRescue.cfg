// ============================================================================
// Agency Station Rescue
// Full-sized derelict station rescue / salvage contracts for Contract Configurator
// Tailored for KSP 1.12.5 + Contract Configurator + Kerbalism
// ============================================================================

CONTRACT_GROUP
{
    name = AgencyStationRescue
    displayName = Agency Station Rescues
    minVersion = 1.30.5
    maxSimultaneous = 1
}

// ---------------------------------------------------------------------------
// Fictional agencies.  Reuses Contract Configurator's station artwork so the
// pack needs no external texture dependency.
// ---------------------------------------------------------------------------
AGENT
{
    name = Northstar Orbital Systems
    title = Northstar Orbital Systems
    description = A commercial operator specializing in long-duration orbital infrastructure.
    logoURL = ContractConfigurator/Agencies/Stations
    logoScaledURL = ContractConfigurator/Agencies/Stations_scaled
    mentality = NoRandomContractMentality
}
AGENT
{
    name = Meridian Research Directorate
    title = Meridian Research Directorate
    description = An independent scientific organization operating crewed research facilities.
    logoURL = ContractConfigurator/Agencies/Stations
    logoScaledURL = ContractConfigurator/Agencies/Stations_scaled
    mentality = NoRandomContractMentality
}
AGENT
{
    name = Horizon Deep Space Cooperative
    title = Horizon Deep Space Cooperative
    description = A cooperative exploration agency specializing in remote stations and observatories.
    logoURL = ContractConfigurator/Agencies/Stations
    logoScaledURL = ContractConfigurator/Agencies/Stations_scaled
    mentality = NoRandomContractMentality
}
AGENT
{
    name = Red Dune Scientific Consortium
    title = Red Dune Scientific Consortium
    description = A consortium dedicated to long-duration planetary and deep-space research.
    logoURL = ContractConfigurator/Agencies/Stations
    logoScaledURL = ContractConfigurator/Agencies/Stations_scaled
    mentality = NoRandomContractMentality
}

// ---------------------------------------------------------------------------
// Kerbalism-safe emergency habitation module.
// Clone the already-patched Hitchhiker at FINAL so it inherits the user's
// Kerbalism habitat configuration, then add large emergency stores.
// Hidden from the editor; it exists only inside spawned rescue stations.
// ---------------------------------------------------------------------------
+PART[crewCabin]:NEEDS[Kerbalism]:FINAL
{
    @name = ASR-rescue-hab
    @title = Agency Emergency Habitation Module
    @manufacturer = Inter-Agency Emergency Systems
    @description = A sealed long-duration emergency habitat carried by derelict agency stations.
    @category = none
    %TechHidden = True

    !RESOURCE[ElectricCharge] {}
    RESOURCE
    {
        name = ElectricCharge
        amount = 10000
        maxAmount = 10000
    }

    !RESOURCE[Food] {}
    RESOURCE
    {
        name = Food
        amount = 3000
        maxAmount = 3000
    }

    !RESOURCE[Water] {}
    RESOURCE
    {
        name = Water
        amount = 1500
        maxAmount = 1500
    }

    !RESOURCE[Oxygen] {}
    RESOURCE
    {
        name = Oxygen
        amount = 500000
        maxAmount = 500000
    }

    !RESOURCE[Nitrogen] {}
    RESOURCE
    {
        name = Nitrogen
        amount = 20000
        maxAmount = 20000
    }
}


// ============================================================================
// 01 - AURORA HAVEN / KERBIN
// ============================================================================
CONTRACT_TYPE:NEEDS[ContractConfigurator,Kerbalism,StationPartsExpansionRedux]
{
    name = ASR_AuroraHaven
    group = AgencyStationRescue
    sortKey = ASR-01

    agent = Northstar Orbital Systems
    title = Rescue the crew of Aurora Haven
    genericTitle = Agency Station Rescue: Kerbin
    description = Northstar Orbital Systems has lost command and telemetry from Aurora Haven in high Kerbin orbit. Both long-range relays and the primary attitude controller have failed, and emergency consumables are nearly exhausted. Rendezvous, dock, recover the two crew members, and preserve the damaged station. The failed hardware remains aboard after salvage and can be restored by an engineer with repair kits.
    synopsis = Rendezvous with Aurora Haven, dock with the derelict station, and recover its two crew members.
    notes = Primary rescue docking interface: standard 1.25 m Clamp-O-Tron-compatible port. Medium-large 3.75 m station with redundant Kerbalism life-support storage and greenhouse capability; Clamp-O-Tron Sr ports are also available.
    completedMessage = Aurora Haven's crew is safe. Under the inter-agency salvage agreement, control of the recovered station has been transferred to the Kerbal Space Program.

    targetBody = Kerbin
    prestige = Significant
    maxCompletions = 1
    maxSimultaneous = 1
    minExpiry = 5
    maxExpiry = 20
    deadline = 365

    advanceFunds = 30000
    rewardFunds = 95000
    rewardScience = 3
    rewardReputation = 8
    failureFunds = 25000
    failureReputation = 8

    DATA
    {
        type = List<Kerbal>
        hidden = true
        rescueCrew = [NewKerbalWithTrait("Pilot"), NewKerbalWithTrait("Engineer")]
    }

    PARAMETER
    {
        name = DockWithStation
        type = Docking
        vessel = Aurora Haven
        title = Dock with Aurora Haven
    }

    PARAMETER
    {
        name = KeepStationIntact
        type = VesselNotDestroyed
        vessel = Aurora Haven
        title = Do not destroy Aurora Haven
    }

    PARAMETER
    {
        name = RecoverCrew
        type = RecoverKerbal
        kerbal = @/rescueCrew
        title = Recover both Aurora Haven crew members to Kerbin
    }

    BEHAVIOUR
    {
        name = SpawnStation
        type = SpawnVessel

        VESSEL
        {
            name = Aurora Haven
            craftURL = AgencyStationRescue/Craft/AuroraHaven.craft
            flagURL = Squad/Flags/satellite
            vesselType = Station
            owned = false
            targetBody = Kerbin

            ORBIT
            {
                SMA = 850000
                ECC = 0.02
                INC = 28
                LPE = 85
                LAN = 35
                MNA = 1.2
                EPH = UniversalTime()
                REF = 1
            }

            CREW
            {
                name = @/rescueCrew.ElementAt(0)
                addToRoster = true
            }
            CREW
            {
                name = @/rescueCrew.ElementAt(1)
                addToRoster = true
            }
        }
    }

    BEHAVIOUR
    {
        name = TransferStation
        type = ChangeVesselOwnership
        onState = CONTRACT_SUCCESS
        vessel = Aurora Haven
        owned = true
    }
}


