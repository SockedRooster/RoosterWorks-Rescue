    description = Meridian Research Directorate's Selene Ark suffered a cascading power-control failure in Dres orbit. Four main solar arrays are offline, batteries are nearly flat, emergency life-support stores are depleted, and one communications transmitter has failed. Dock with the station and evacuate all three crew members. The communications fault specifically requires an Engineer under Kerbalism's repair rules, while the remaining damaged systems retain their native repair requirements.
    synopsis = Dock with Selene Ark in Dres orbit and return its three-person research crew to Kerbin.
    notes = Primary rescue docking interface: standard 1.25 m Clamp-O-Tron-compatible port. Selene Ark adds a 3.75 m greenhouse and expandable centrifuge to the proven station core.
    completedMessage = The Selene Ark crew is home. Meridian has signed the station over to the Kerbal Space Program rather than abandon a valuable orbital laboratory.

    targetBody = Dres
    prestige = Significant
    maxCompletions = 1
    maxSimultaneous = 1
    minExpiry = 5
    maxExpiry = 25
    deadline = 600

    advanceFunds = 50000
    rewardFunds = 145000
    rewardScience = 5
    rewardReputation = 10
    failureFunds = 35000
    failureReputation = 10

    REQUIREMENT
    {
        name = GillyRescueComplete
        type = CompleteContract
        contractType = ASR_IkeFarSideDepot
        minCount = 1
    }

    DATA
    {
        type = List<Kerbal>
        hidden = true
        rescueCrew = [NewKerbalWithTrait("Scientist"), NewKerbalWithTrait("Engineer"), NewKerbalWithTrait("Pilot")]
    }

    PARAMETER
    {
        name = DockWithStation
        type = Docking
        vessel = Selene Ark
        title = Dock with Selene Ark
    }

    PARAMETER
    {
        name = KeepStationIntact
        type = VesselNotDestroyed
        vessel = Selene Ark
        title = Do not destroy Selene Ark
    }

    PARAMETER
    {
        name = RecoverCrew
        type = RecoverKerbal
        kerbal = @/rescueCrew
        title = Recover all three Selene Ark crew members to Kerbin
