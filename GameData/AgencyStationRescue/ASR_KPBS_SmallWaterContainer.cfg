// Rescue-pack-only K&K small water container for Kerbalism.
// KPBS's dedicated KKAOSS_LS_container_water_small is not loaded under a pure
// Kerbalism profile, so clone the Kerbalism-compatible K&K food container model
// and replace its resource with Water after KPBS/Kerbalism patches are applied.

+PART[KKAOSS_LS_container_food_small]:NEEDS[Kerbalism,PlanetarySurfaceStructures]:AFTER[PlanetarySurfaceStructures]
{
    @name = ASR_KKAOSS_LS_container_water_small
    @title = K&K Small Water Container (Rescue)
    @description = A rescue-mission K&K small container configured for Water storage.
    @category = none
    @TechRequired = Unresearchable

    !RESOURCE[Food] {}
    RESOURCE
    {
        name = Water
        amount = 1025
        maxAmount = 1025
    }
}
