// ============================================================================
// Agency Station Rescue - Surface Operations Expansion
// Requires the base AgencyStationRescue.cfg plus Kerbal Planetary Base Systems.
// ============================================================================

@CONTRACT_GROUP[AgencyStationRescue]
{
    @displayName = Inter-Agency Rescue & Salvage
    @maxSimultaneous = 3
}

// Kerbalism-safe KPBS central hub used as the emergency core of spawned bases.
// Hidden from editor; the completed base becomes useful salvage after rescue.
+PART[KKAOSS_Central_Hub]:NEEDS[PlanetarySurfaceStructures,Kerbalism]:FINAL
{
    @name = ASR-ground-core
    @title = Inter-Agency Emergency Base Core
    @manufacturer = Inter-Agency Emergency Systems
    @description = A hardened emergency command and life-support hub used by remote surface installations.
    @category = none
    %TechHidden = True

    !RESOURCE[ElectricCharge] {}
    RESOURCE
    {
        name = ElectricCharge
        amount = 15000
        maxAmount = 15000
    }

    !RESOURCE[Food] {}
    RESOURCE
    {
        name = Food
        amount = 5000
        maxAmount = 5000
    }

    !RESOURCE[Water] {}
    RESOURCE
    {
        name = Water
        amount = 2500
        maxAmount = 2500
    }

    !RESOURCE[Oxygen] {}
    RESOURCE
    {
        name = Oxygen
        amount = 700000
        maxAmount = 700000
    }

    !RESOURCE[Nitrogen] {}
    RESOURCE
    {
        name = Nitrogen
        amount = 30000
        maxAmount = 30000
    }
}


// ============================================================================
// 02 - NORTHSTAR FRONTIER BASE / MUN
// ============================================================================
CONTRACT_TYPE:NEEDS[ContractConfigurator,Kerbalism,PlanetarySurfaceStructures]
{
    name = ASR_NorthstarFrontierBase
    group = AgencyStationRescue
    sortKey = ASR-02

    agent = Northstar Orbital Systems
    title = Evacuate Northstar Frontier Base
    genericTitle = Agency Surface Rescue: Mun
    description = Northstar Frontier Base suffered a total power-distribution failure during the Munar night. All main solar arrays and the base core process controller are failed, the batteries are completely discharged, and the communications transceiver was damaged by the surge. The crew evacuated beside the installation. Recover both personnel and preserve the base; the communications failure requires an Engineer to repair.
    synopsis = Land at Northstar Frontier Base, reach the installation, and recover its two stranded crew members.
    notes = Docking interface: standard 1.25 m Clamp-O-Tron.
    completedMessage = The Frontier Base crew is safe. Northstar has transferred the abandoned Munar installation to KSP under the inter-agency salvage agreement.

    targetBody = Mun
    prestige = Significant
    maxCompletions = 1
    maxSimultaneous = 1
    minExpiry = 5
    maxExpiry = 25
    deadline = 700

    advanceFunds = 60000
    rewardFunds = 155000
    rewardScience = 6
    rewardReputation = 12
    failureFunds = 40000
    failureReputation = 10

    REQUIREMENT
    {
        name = AuroraRescueComplete
        type = CompleteContract
        contractType = ASR_AuroraHaven
        minCount = 1
    }

    DATA
    {
        type = List<Kerbal>
        hidden = true
        rescueCrew = [NewKerbalWithTrait("Engineer"), NewKerbalWithTrait("Scientist")]
    }

    BEHAVIOUR
    {
        name = BaseWaypoint
        type = WaypointGenerator
        WAYPOINT
        {
            name = Northstar Frontier Base
            targetBody = Mun
            icon = balloon
            altitude = 0
            latitude = 1.07922678190179
            longitude = 22.8564532504125
        }
    }

    PARAMETER
    {
        name = ReachBase
        type = VisitWaypoint
        index = 0
        distance = 300
        title = Reach Northstar Frontier Base
    }

    PARAMETER
    {
        name = PreserveBase
        type = VesselNotDestroyed
        vessel = Northstar Frontier Base
        title = Preserve the abandoned base
    }

    PARAMETER
    {
        name = RecoverCrew
        type = RecoverKerbal
        kerbal = @/rescueCrew
        title = Recover both Frontier Base crew members to Kerbin
    }

    BEHAVIOUR
    {
        name = SpawnBase
        type = SpawnVessel

        VESSEL
        {
            name = Northstar Frontier Base
            craftURL = AgencyStationRescue/Craft/NorthstarFrontierBase.craft
            flagURL = Squad/Flags/satellite
            vesselType = Base
            owned = false
            targetBody = Mun
            lat = 1.07922678190179
            lon = 22.8564532504125
            height = 1.00
            heading = 90
            pitch = 0
            roll = 0
        }
    }

    BEHAVIOUR
    {
        name = SpawnRescueCrew
        type = SpawnKerbal

        KERBAL
        {
            kerbal = @/rescueCrew.ElementAt(0)
            targetBody = Mun
            lat = 1.07972678190179
            lon = 22.8568532504125
            heading = 90
            owned = false
            addToRoster = true
            kerbalType = Unowned
        }
        KERBAL
        {
            kerbal = @/rescueCrew.ElementAt(1)
            targetBody = Mun
            lat = 1.07952678190179
            lon = 22.8560532504125
            heading = 270
            owned = false
            addToRoster = true
            kerbalType = Unowned
        }
    }

    BEHAVIOUR
    {
        name = TransferBase
        type = ChangeVesselOwnership
        onState = CONTRACT_SUCCESS
        vessel = Northstar Frontier Base
        owned = true
    }
}


